<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ToDoList - 2572001</title>
    <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
    <style>
        body {
            padding: 30px;
        }

        .container {
            max-width: 500px;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px lightgrey;
            margin: auto;
        }

        .input-group {
            margin-bottom: 5px;
        }

        input {
            width: 70%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }

        button {
            padding: 6px 12px;
            cursor: pointer;
            border: none;
            color: white;
            border-radius: 4px;
        }

        #btnTambah {
            background: #28a745;
            padding: 8px 12px;
        }

        .danger {
            color: red;
            font-weight: bold;
        }

        ul {
            list-style: none;
            padding: 0;
        }

        li {
            padding: 10px 20px;
            background: #fff3cd;
            margin-bottom: 5px;
            border-radius: 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th,
        td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: left;
        }

        th {
            background-color: #e9ecef;
        }

        button {
            margin-right: 5px;
        }

        .btn-done {
            background-color: #007bff;
        }

        .btn-edit,
        .btn-submit {
            background-color: #ffff00;
            color: black;
        }

        .btn-delete {
            background-color: #dc3545;
        }

        h3 {
            margin-top: 30px;
            border-bottom: 2px solid #eee;
            padding-bottom: 5px;
        }

        footer {
            padding: 20px;
            text-align: center;
        }

        .tercoret {
            text-decoration: line-through;
            color: #888;
        }
    </style>
</head>

<body>

    <div class="container">
        <h2>My To Do List</h2>

        <div class="input-group">
            <input type="text" id="taskInput" placeholder="Tambah tugas..." maxlength="20">
            <button id="btnTambah">Tambah</button>
        </div>

        <h3>Belum Selesai</h3>
        <ul id="taskList">
        </ul>

        <h3>Sudah Selesai (Riwayat)</h3>
        <table id="completedTable">
            <thead>
                <tr>
                    <th>Nama Tugas</th>
                    <th style="width: 100px;">Aksi</th>
                </tr>
            </thead>
            <tbody>
            </tbody>
        </table>
    </div>

    <footer>
        <strong>&copy; 2026 2572001 - Joshua Christopher Gunawan. All rights reserved.</strong>
    </footer>

    <script>
        $(document).ready(function () {
            $("#btnTambah").click(function () {
                var isiTask = $.trim($("#taskInput").val());

                if (isiTask == "") {
                    alert("Tugas tidak boleh kosong!");
                    return;
                }

                var li = $("<li>");
                var spanTask = $("<span>").text(isiTask);
                var tempatButton = $("<div>");
                var btnDone = $("<button>").addClass("btn-done").text("Selesai");
                var btnEdit = $("<button>").addClass("btn-edit").text("Edit");

                tempatButton.append(btnDone);
                tempatButton.append(btnEdit);
                li.append(spanTask);
                li.append(tempatButton);
                $("#taskList").append(li);
                $("#taskInput").val("");
            });

            $(document).on("click", ".btn-edit", function () {
                var li = $(this).closest("li");
                var teksLama = li.find("span").text();
                var inputEdit = $("<input>").val(teksLama).attr("maxlength", "20");
                var tempatButton = $(this).parent();

                li.find("span").replaceWith(inputEdit);
                tempatButton.empty();
                tempatButton.append($("<button>").addClass("btn-submit").text("Simpan"));
            });

            $(document).on("click", ".btn-submit", function () {
                var li = $(this).closest("li");
                var teksBaru = $.trim(li.find("input").val());

                if (teksBaru == "") {
                    alert("Tugas tidak boleh kosong.");
                    return;
                }

                var tempatButton = $(this).parent();
                var btnDone = $("<button>").addClass("btn-done").text("Selesai");
                var btnEdit = $("<button>").addClass("btn-edit").text("Edit");

                li.find("input").replaceWith($("<span>").text(teksBaru));
                tempatButton.empty();
                tempatButton.append(btnDone);
                tempatButton.append(btnEdit);
            });

            $(document).on("click", ".btn-done", function () {
                var li = $(this).closest("li");
                var namaTask = li.find("span").text();

                if (namaTask == "") {
                    namaTask = li.find("input").val();
                }

                var tr = $("<tr>");
                var tdNama = $("<td>");
                var tdAksi = $("<td>");
                var spanSelesai = $("<span>").addClass("tercoret").text(namaTask);
                var btnHapus = $("<button>").addClass("btn-delete").text("Hapus");

                tdNama.append(spanSelesai);
                tdAksi.append(btnHapus);
                tr.append(tdNama);
                tr.append(tdAksi);
                $("#completedTable tbody").append(tr);
                li.remove();
            });

            $(document).on("click", ".btn-delete", function () {
                $(this).closest("tr").remove();
            });
        });
    </script>
</body>

</html>
